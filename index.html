<!DOCTYPE html>

<div id="app">
  <header id="topbar">
    <div class="brand">相剋のビルドサーガ<span class="sub">BUILD SAGA</span></div>
    <div id="runinfo" class="runinfo"></div>
    <div class="topbtns">
      <button class="btn tiny" data-open="build">ビルド</button>

      <button class="btn tiny" data-open="codex">図鑑</button>
      <button class="btn tiny" data-open="help">遊び方</button>
    </div>
  </header>

  <main id="screen"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toaster"></div>
</div>
